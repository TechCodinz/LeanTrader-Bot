name: LeanTrader supported release

on:
  push:
  pull_request:

jobs:
  supported-paper-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install supported runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.runtime.txt -r ops/vps_bridge/requirements.txt pytest

      - name: Compile supported package
        run: python -m compileall -q src/leantrader/production

      - name: Reject unsafe configuration
        env:
          ENABLE_LIVE: 'false'
          ALLOW_LIVE: 'false'
          LIVE_CONFIRM: 'NO'
          TRADING_MODE: 'paper'
          PYTHONPATH: src
        run: |
          python -m leantrader.production.runner --preflight
          if ENABLE_LIVE=true python -m leantrader.production.runner --preflight; then
            echo "unsafe live configuration was accepted"
            exit 1
          fi

      - name: Run v1.60.8 focused Testnet exit recycle regressions
        env:
          ENABLE_LIVE: 'false'
          ALLOW_LIVE: 'false'
          LIVE_CONFIRM: 'NO'
          TRADING_MODE: 'paper'
          PYTHONPATH: src
        run: python -m pytest -q tests/test_production_testnet_exit_recycle_v1608.py

      - name: Run supported release tests
        env:
          ENABLE_LIVE: 'false'
          ALLOW_LIVE: 'false'
          LIVE_CONFIRM: 'NO'
          TRADING_MODE: 'paper'
          PYTHONPATH: src
        run: python -m pytest -q tests/test_production_*.py tests/test_cns_brain_memory.py tests/test_strategy_observatory.py tests/test_testnet_execution.py tests/test_vps_ops_bridge.py

      - name: Validate VPS operations scripts
        run: |
          bash -n scripts/install_vps_ops_bridge.sh
          python -m compileall -q ops/vps_bridge
          if grep -Eq '(NOPASSWD:[[:space:]]+ALL|/bin/(ba)?sh|\*)' ops/vps_bridge/leantrader-ops.sudoers; then
            echo "unsafe sudoers surface detected"
            exit 1
          fi

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build container
        run: docker build --tag leantrader-paper:test .
