name: LeanTrader supported release

on:
  push:
  pull_request:

jobs:
  supported-paper-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install supported runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.runtime.txt pytest

      - name: Compile supported package
        run: python -m compileall -q src/leantrader/production

      - name: Reject unsafe configuration
        env:
          ENABLE_LIVE: 'false'
          ALLOW_LIVE: 'false'
          LIVE_CONFIRM: 'NO'
          TRADING_MODE: 'paper'
          PYTHONPATH: src
        run: |
          python -m leantrader.production.runner --preflight
          if ENABLE_LIVE=true python -m leantrader.production.runner --preflight; then
            echo "unsafe live configuration was accepted"
            exit 1
          fi

      - name: Run supported release tests
        env:
          ENABLE_LIVE: 'false'
          ALLOW_LIVE: 'false'
          LIVE_CONFIRM: 'NO'
          TRADING_MODE: 'paper'
          PYTHONPATH: src
        run: python -m pytest -q tests/test_production_*.py

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build container
        run: docker build --tag leantrader-paper:test .
