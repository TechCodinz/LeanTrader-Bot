services:
  leantrader:
    build:
      context: .
      dockerfile: Dockerfile
    image: leantrader-paper:local
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ./runtime:/app/runtime
      - ./logs:/app/logs
      - ./secrets:/run/secrets:ro
    environment:
      TRADING_MODE: paper
      ENABLE_LIVE: "false"
      ALLOW_LIVE: "false"
      LIVE_CONFIRM: "NO"
      DATA_EXCHANGE: ${DATA_EXCHANGE:-bybit}
      PAPER_SYMBOLS: ${PAPER_SYMBOLS:-AUTO}
      MARKET_QUOTE: ${MARKET_QUOTE:-USDT}
      MARKET_UNIVERSE_STATE_PATH: ${MARKET_UNIVERSE_STATE_PATH:-runtime/vps_market_universe.json}
      EXCHANGE_INTELLIGENCE_STATE_PATH: ${EXCHANGE_INTELLIGENCE_STATE_PATH:-runtime/vps_exchange_intelligence.json}
      MARKET_SCAN_BATCH_SIZE: ${MARKET_SCAN_BATCH_SIZE:-18}
      MARKET_REFRESH_SECONDS: ${MARKET_REFRESH_SECONDS:-3600}
      MARKET_MIN_QUOTE_VOLUME_USD: ${MARKET_MIN_QUOTE_VOLUME_USD:-250000}
      MARKET_MAX_SPREAD_BPS: ${MARKET_MAX_SPREAD_BPS:-75}
      PAPER_TIMEFRAME: ${PAPER_TIMEFRAME:-15m}
      CONFIRM_TIMEFRAMES: ${CONFIRM_TIMEFRAMES:-AUTO}
      PAPER_CANDLE_LIMIT: ${PAPER_CANDLE_LIMIT:-320}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      PAPER_START_CASH: ${PAPER_START_CASH:-50}
      PAPER_ORDER_USD: ${PAPER_ORDER_USD:-2}
      MAX_OPEN_POSITIONS: ${MAX_OPEN_POSITIONS:-2}
      MAX_POSITION_PCT: ${MAX_POSITION_PCT:-0.10}
      RISK_PER_TRADE_PCT: ${RISK_PER_TRADE_PCT:-0.005}
      MAX_ENTRIES_PER_SYMBOL: ${MAX_ENTRIES_PER_SYMBOL:-2}
      SCALE_IN_MIN_CONFIDENCE: ${SCALE_IN_MIN_CONFIDENCE:-0.75}
      MAX_DAILY_LOSS_PCT: ${MAX_DAILY_LOSS_PCT:-0.02}
      MAX_DRAWDOWN_PCT: ${MAX_DRAWDOWN_PCT:-0.10}
      PAPER_FEE_BPS: ${PAPER_FEE_BPS:-10}
      PAPER_SLIPPAGE_BPS: ${PAPER_SLIPPAGE_BPS:-5}
      ATR_STOP_MULT: ${ATR_STOP_MULT:-1.5}
      ATR_TRAIL_MULT: ${ATR_TRAIL_MULT:-2.0}
      PARTIAL_TAKE_PROFIT_ATR: ${PARTIAL_TAKE_PROFIT_ATR:-1.5}
      PARTIAL_TAKE_PROFIT_FRACTION: ${PARTIAL_TAKE_PROFIT_FRACTION:-0.50}
      FINAL_TAKE_PROFIT_ATR: ${FINAL_TAKE_PROFIT_ATR:-3.0}
      PAPER_STATE_PATH: ${PAPER_STATE_PATH:-runtime/vps_paper_state.json}
      INTELLIGENCE_STATE_PATH: ${INTELLIGENCE_STATE_PATH:-runtime/vps_intelligence_state.json}
      PATTERN_MEMORY_PATH: ${PATTERN_MEMORY_PATH:-runtime/vps_pattern_memory.json}
      NEWS_STATE_PATH: ${NEWS_STATE_PATH:-runtime/vps_news_state.json}
      PUBLIC_CONTEXT_STATE_PATH: ${PUBLIC_CONTEXT_STATE_PATH:-runtime/vps_public_context.json}
      PUBLIC_CONTEXT_ENABLED: ${PUBLIC_CONTEXT_ENABLED:-true}
      PUBLIC_CONTEXT_REFRESH_SECONDS: ${PUBLIC_CONTEXT_REFRESH_SECONDS:-900}
      NEWS_MAX_AGE_SECONDS: ${NEWS_MAX_AGE_SECONDS:-86400}
      NEWS_MAX_FUTURE_SKEW_SECONDS: ${NEWS_MAX_FUTURE_SKEW_SECONDS:-300}
      MAX_CLOCK_OFFSET_MS: ${MAX_CLOCK_OFFSET_MS:-5000}
      CLOCK_SYNC_SECONDS: ${CLOCK_SYNC_SECONDS:-300}
      CANDLE_STALE_MULTIPLIER: ${CANDLE_STALE_MULTIPLIER:-2.5}
      ARBITRAGE_MONITOR_ENABLED: ${ARBITRAGE_MONITOR_ENABLED:-true}
      ARBITRAGE_VENUES: ${ARBITRAGE_VENUES:-bybit,okx}
      ARBITRAGE_REFRESH_SECONDS: ${ARBITRAGE_REFRESH_SECONDS:-60}
      ARBITRAGE_SLIPPAGE_BPS: ${ARBITRAGE_SLIPPAGE_BPS:-3}
      STRATEGY_OBSERVATORY_STATE_PATH: ${STRATEGY_OBSERVATORY_STATE_PATH:-runtime/vps_strategy_observatory.json}
      RESEARCH_STATE_PATH: ${RESEARCH_STATE_PATH:-runtime/vps_research_governor.json}
      MODEL_RESEARCH_STATE_PATH: ${MODEL_RESEARCH_STATE_PATH:-runtime/vps_model_research.json}
      MODEL_RESEARCH_ENABLED: ${MODEL_RESEARCH_ENABLED:-false}
      MODEL_RESEARCH_PROVIDER: ${MODEL_RESEARCH_PROVIDER:-}
      MODEL_RESEARCH_MODEL: ${MODEL_RESEARCH_MODEL:-}
      MODEL_RESEARCH_API_KEY_FILE: ${MODEL_RESEARCH_API_KEY_FILE:-/run/secrets/model_research_api_key}
      MODEL_RESEARCH_ENDPOINT: ${MODEL_RESEARCH_ENDPOINT:-}
      MODEL_RESEARCH_INTERVAL_CYCLES: ${MODEL_RESEARCH_INTERVAL_CYCLES:-60}
      DECISION_ROUTER_STATE_PATH: ${DECISION_ROUTER_STATE_PATH:-runtime/vps_decision_router.json}
      CNS_STATE_PATH: ${CNS_STATE_PATH:-runtime/vps_cns_state.json}
      BRAIN_STATE_PATH: ${BRAIN_STATE_PATH:-runtime/vps_brain_state.json}
      MEMORY_RETENTION_STATE_PATH: ${MEMORY_RETENTION_STATE_PATH:-runtime/vps_memory_retention.json}
      CAPITAL_GROWTH_STATE_PATH: ${CAPITAL_GROWTH_STATE_PATH:-runtime/vps_capital_growth.json}
      MEMORY_MAX_EPISODES: ${MEMORY_MAX_EPISODES:-5000}
      MEMORY_HALF_LIFE_HOURS: ${MEMORY_HALF_LIFE_HOURS:-720}
      BRAIN_MIN_STRATEGY_SAMPLES: ${BRAIN_MIN_STRATEGY_SAMPLES:-50}
      BRAIN_NEGATIVE_EXPECTANCY_FLOOR: ${BRAIN_NEGATIVE_EXPECTANCY_FLOOR:--0.001}
      BRAIN_QUARANTINE_MIN_SAMPLES: ${BRAIN_QUARANTINE_MIN_SAMPLES:-100}
      BRAIN_QUARANTINE_EXPECTANCY_FLOOR: ${BRAIN_QUARANTINE_EXPECTANCY_FLOOR:--0.004}
      BRAIN_RECOVERY_EXPECTANCY_FLOOR: ${BRAIN_RECOVERY_EXPECTANCY_FLOOR:-0.0005}
      CAPITAL_PRINCIPAL_FLOOR_FRACTION: ${CAPITAL_PRINCIPAL_FLOOR_FRACTION:-0.70}
      CAPITAL_PROFIT_REINVEST_FRACTION: ${CAPITAL_PROFIT_REINVEST_FRACTION:-0.50}
      PROVENANCE_PATH: ${PROVENANCE_PATH:-runtime/vps_decision_provenance.jsonl}
      PROMETHEUS_METRICS_PATH: ${PROMETHEUS_METRICS_PATH:-runtime/vps_metrics.prom}
      HEARTBEAT_PATH: ${HEARTBEAT_PATH:-runtime/vps_heartbeat.json}
      HEARTBEAT_MAX_AGE: ${HEARTBEAT_MAX_AGE:-180}
      EXPECTED_RUNTIME_ID: ${EXPECTED_RUNTIME_ID:-verified-multi-engine-v12.4-cns-brain-memory}
      TRADES_LOG_PATH: ${TRADES_LOG_PATH:-logs/vps_trades.jsonl}
      ADAPTIVE_LEARNING_RATE: ${ADAPTIVE_LEARNING_RATE:-0.08}
      ADAPTIVE_MIN_SAMPLES: ${ADAPTIVE_MIN_SAMPLES:-5}
      MARKET_EVIDENCE_MIN_SAMPLES: ${MARKET_EVIDENCE_MIN_SAMPLES:-8}
      MARKET_EVIDENCE_WINDOW: ${MARKET_EVIDENCE_WINDOW:-50}
      ROUTER_MIN_ADVANCED_CONFIDENCE: ${ROUTER_MIN_ADVANCED_CONFIDENCE:-0.20}
      ROUTER_MIN_COMBINED_SCORE: ${ROUTER_MIN_COMBINED_SCORE:-0.20}
      ROUTER_NEGATIVE_CONSENSUS_VETO: ${ROUTER_NEGATIVE_CONSENSUS_VETO:--0.25}
      ENGINE_FAILURE_THRESHOLD: ${ENGINE_FAILURE_THRESHOLD:-3}
      ENGINE_RECOVERY_SECONDS: ${ENGINE_RECOVERY_SECONDS:-60}
      TELEGRAM_BOT_TOKEN_FILE: ${TELEGRAM_BOT_TOKEN_FILE:-/run/secrets/telegram_bot_token}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      TELEGRAM_ADMIN_CHAT_IDS: ${TELEGRAM_ADMIN_CHAT_IDS:-}
      TELEGRAM_FREE_CHAT_ID: ${TELEGRAM_FREE_CHAT_ID:-}
      TELEGRAM_FREE_CHAT_IDS: ${TELEGRAM_FREE_CHAT_IDS:-}
      TELEGRAM_PAID_CHAT_ID: ${TELEGRAM_PAID_CHAT_ID:-}
      TELEGRAM_PAID_CHAT_IDS: ${TELEGRAM_PAID_CHAT_IDS:-}
      TELEGRAM_FREE_MIN_CONFIDENCE: ${TELEGRAM_FREE_MIN_CONFIDENCE:-0.85}
      TELEGRAM_PAID_MIN_CONFIDENCE: ${TELEGRAM_PAID_MIN_CONFIDENCE:-0.70}
      TELEGRAM_MOON_MIN_SCORE: ${TELEGRAM_MOON_MIN_SCORE:-1.0}
      TELEGRAM_SIGNAL_COOLDOWN_SECONDS: ${TELEGRAM_SIGNAL_COOLDOWN_SECONDS:-900}
      TELEGRAM_MONITOR_INTERVAL_CYCLES: ${TELEGRAM_MONITOR_INTERVAL_CYCLES:-60}
      TELEGRAM_TESTNET_TRADE_URL: ${TELEGRAM_TESTNET_TRADE_URL:-https://testnet.bybit.com/}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      BYBIT_TESTNET_ENABLED: ${BYBIT_TESTNET_ENABLED:-false}
      BYBIT_TESTNET_CONFIRM: ${BYBIT_TESTNET_CONFIRM:-}
      BYBIT_TESTNET_API_KEY_FILE: ${BYBIT_TESTNET_API_KEY_FILE:-/run/secrets/bybit_testnet_api_key}
      BYBIT_TESTNET_API_SECRET_FILE: ${BYBIT_TESTNET_API_SECRET_FILE:-/run/secrets/bybit_testnet_api_secret}
      BYBIT_TESTNET_STATE_PATH: ${BYBIT_TESTNET_STATE_PATH:-runtime/vps_testnet_execution.json}
      BYBIT_TESTNET_MAX_ORDER_USD: ${BYBIT_TESTNET_MAX_ORDER_USD:-10}
      BYBIT_TESTNET_MAX_POSITION_USD: ${BYBIT_TESTNET_MAX_POSITION_USD:-20}
      BYBIT_TESTNET_MAX_DAILY_SUBMITTED_USD: ${BYBIT_TESTNET_MAX_DAILY_SUBMITTED_USD:-50}
      BYBIT_TESTNET_MAX_ORDERS_PER_DAY: ${BYBIT_TESTNET_MAX_ORDERS_PER_DAY:-20}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
